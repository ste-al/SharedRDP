name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces the run in progress; runs on
# main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Scripts in Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-Scripts.ps1 -OutputPath out

      - name: Scripts in PowerShell 7
        if: success() || failure()
        shell: pwsh
        run: .\tests\Test-Scripts.ps1

      - name: Regression checks in Windows PowerShell 5.1
        if: success() || failure()
        shell: powershell
        run: |
          .\tests\Test-EngineRegression.ps1
          .\tests\Test-DashboardRegression.ps1
          .\tests\Test-CiSafety.ps1

      - name: Regression checks in PowerShell 7
        if: success() || failure()
        shell: pwsh
        run: |
          .\tests\Test-EngineRegression.ps1
          .\tests\Test-DashboardRegression.ps1
          .\tests\Test-CiSafety.ps1

      - name: PSScriptAnalyzer
        if: success() || failure()
        shell: pwsh
        run: .\tests\Invoke-Analyzer.ps1

      - name: Command line, checking this runner
        if: success() || failure()
        shell: powershell
        run: .\tests\Test-CommandLine.ps1 -CiSetup -OutputPath out

      - name: Dashboard, checking this runner
        if: success() || failure()
        shell: powershell
        run: .\tests\Test-Dashboard.ps1 -Dark -OutputPath out

      - name: Keep the screenshots and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots-and-logs
          path: out/
          if-no-files-found: ignore
