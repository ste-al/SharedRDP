name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Scripts in Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-Scripts.ps1 -OutputPath out

      - name: Scripts in PowerShell 7
        if: success() || failure()
        shell: pwsh
        run: .\tests\Test-Scripts.ps1

      - name: PSScriptAnalyzer
        if: success() || failure()
        shell: pwsh
        run: .\tests\Invoke-Analyzer.ps1

      - name: Command line, checking this runner
        if: success() || failure()
        shell: powershell
        run: .\tests\Test-CommandLine.ps1 -CiSetup -OutputPath out

      - name: Dashboard, checking this runner
        if: success() || failure()
        shell: powershell
        run: .\tests\Test-Dashboard.ps1 -Dark -OutputPath out

      - name: Keep the screenshots and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots-and-logs
          path: out/
          if-no-files-found: ignore

      - name: Print the screenshots into the log
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem out -Filter *.png | ForEach-Object {
            "=====BEGIN $($_.Name)====="
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
            for ($i = 0; $i -lt $b64.Length; $i += 4000) { $b64.Substring($i, [Math]::Min(4000, $b64.Length - $i)) }
            "=====END $($_.Name)====="
          }
